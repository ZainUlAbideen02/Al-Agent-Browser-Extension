<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Agent Side Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --vision-color: #8b5cf6;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 13px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
        }

        .title {
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }
        .status-dot.disconnected { background: var(--danger); }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        input, textarea, select {
            background: #090d16;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        button:hover { opacity: 0.9; }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-vision { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid #8b5cf6; }

        .stream-container {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .stream-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Pulsing Crosshair Target Overlay */
        .target-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        .crosshair-h {
            position: absolute;
            width: 24px;
            height: 2px;
            background: #ef4444;
            left: -12px;
            top: -1px;
            box-shadow: 0 0 6px #ef4444;
        }

        .crosshair-v {
            position: absolute;
            width: 2px;
            height: 24px;
            background: #ef4444;
            left: -1px;
            top: -12px;
            box-shadow: 0 0 6px #ef4444;
        }

        .marker-pulse {
            width: 16px;
            height: 16px;
            border: 2px solid #ef4444;
            border-radius: 50%;
            position: absolute;
            left: -10px;
            top: -10px;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .marker-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.9);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid #38bdf8;
            white-space: nowrap;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .log-container {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item {
            background: #090d16;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            <span>👁️ Visual Agent Monitor</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span id="statusText" style="font-size:11px; color:var(--text-secondary);">Disconnected</span>
        </div>
    </div>

    <div class="card">
        <label for="targetUrl">Target URL</label>
        <input type="text" id="targetUrl" placeholder="Auto-detected active tab URL...">

        <label for="goal">Objective</label>
        <textarea id="goal" rows="2" placeholder="Goal for active tab...">Type 'tomsmith' into Username field, 'SuperSecretPassword!' into Password field, and click Login button</textarea>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
            <div>
                <label for="resolution">Resolution</label>
                <select id="resolution">
                    <option value="1280x800">1280 x 800</option>
                    <option value="1920x1080">1920 x 1080</option>
                </select>
            </div>
            <div>
                <label for="maxSteps">Max Steps</label>
                <input type="number" id="maxSteps" value="15" min="1" max="30">
            </div>
        </div>

        <button id="startBtn">▶ Run Visual Agent</button>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>Live Stream & Crosshair Overlay</label>
            <span class="badge badge-vision">👁️ Visual Agent Active</span>
        </div>
        <div class="stream-container" id="streamContainer">
            <span id="placeholderText" style="color:var(--text-secondary); font-size:11px;">Waiting for stream...</span>
            <img id="streamImg" class="stream-img" style="display:none;" alt="Live View">

            <!-- Pulsing Crosshair Target Marker Overlay -->
            <div id="targetOverlayMarker" class="target-marker" style="display: none;">
                <div class="crosshair-h"></div>
                <div class="crosshair-v"></div>
                <div class="marker-pulse"></div>
                <div class="marker-label" id="markerLabel">(0, 0)</div>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Execution History</label>
        <div class="log-container" id="logContainer">
            <div style="color:var(--text-secondary); font-size:11px; text-align:center; padding:12px;">No activity logged.</div>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
